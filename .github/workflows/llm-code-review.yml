# This workflow provides reviews for code modifications using AI (large
# language models) based on the file diffs between the head of develop and the
# branch for which this workflow is run. This workflow can be triggered
# manually ('workflow_dispatch' target). Depending how you wish to configure
# your API keys, you may run this workflow either in your own fork (assuming
# this workflow exists in the default branch of your forked repository) or in
# the parent repository. The code reviews are uploaded to a GitHub Actions
# artifact whose URL can be found at the end of the workflow run.
#
# For more documentation, including a list of the available models for
# producing code reviews and instructions for securely configuring API keys,
# see https://github.com/NOAA-EMC/ci-llm-code-review.
#
# ***DO NOT PUT API KEYS DIRECTLY IN THIS FILE*** (always use GitHub secrets)
#
# Alex Richert, Apr 2025

name: llm-code-review
on: [workflow_dispatch]

jobs:
  llm-code-review:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_API_KEY: ${{ secrets.GH_API_KEY }}

    steps:

    - name: "Code review"
      uses: NOAA-EMC/ci-llm-code-review@develop
      with:
        backend: gemini-2.0
        api-key-variable: GEMINI_API_KEY
        provide-codebase: true
        prompt-text: "Follow these instructions carefully. Review the following diff-formatted code modifications, inferring language from provided file names and/or code syntax. Structure the review as 'Summary of Changes,' 'Issues & Possible Errors' (including specific corrections, such as where and how to insert a missing variable declaration, or other changes that need to be propagated throughout the code), and 'Suggestions' with possible better approaches to those modifications if appropriate (do not suggest changes for parts of the code not related to those being modifed). Focus your review entirely on the modifications indicated by the + and - symbols representing new and removed lines. Do not review other parts of the code, which are provided only for context, such as to specifically identify other changes that are or may be needed elsewhere in the code based on the given diff-formatted modifications. Show exact code modifications wherever possible.\n"
        save-diff-files: true
